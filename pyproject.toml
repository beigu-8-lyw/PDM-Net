[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-net-baseline"
version = "0.1.0"
description = "Executable research baseline for long-short-term dynamic prototype alignment"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "Pillow>=10.0"]

[project.scripts]
pdm-net = "pdm_net.cli:main"

[tool.setuptools.packages.find]
include = ["pdm_net*"]
